<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · My Day</title>
<meta name="theme-color" content="#2563eb">
<meta name="robots" content="noindex">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    color: #0f172a;
    background: #f6f7f9;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: 320px;
    pointer-events: none;
    background:
      radial-gradient(60rem 22rem at 12% -12%, rgba(37, 99, 235, .16), transparent 70%),
      radial-gradient(45rem 20rem at 92% -20%, rgba(245, 158, 11, .14), transparent 72%);
  }
  .box {
    position: relative;
    width: min(380px, 100%);
    padding: 26px;
    background: #fff;
    border: 1px solid #e5e9f0;
    border-radius: 18px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 10px 26px -16px rgba(15, 23, 42, .18);
    animation: pop .2s cubic-bezier(.22, .61, .36, 1);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; } }

  .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 20px; }
  .brand svg { width: 22px; height: 22px; fill: none; stroke: #2563eb; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .02em; text-transform: uppercase; color: #334155; }

  label { display: block; margin-bottom: 13px; font-size: 12.5px; font-weight: 550; color: #334155; }
  input {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    color: #0f172a;
    background: #f8fafc;
    border: 1px solid #e5e9f0;
    border-radius: 11px;
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  input:focus {
    background: #fff;
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, .22);
  }
  button {
    width: 100%;
    min-height: 42px;
    margin-top: 6px;
    font: inherit;
    font-size: 14px;
    font-weight: 550;
    color: #fff;
    background: #2563eb;
    border: none;
    border-radius: 11px;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: #1d4ed8; }
  button:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
  .err {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    padding: 10px 12px;
    font-size: 13px;
    color: #b91c1c;
    background: rgba(220, 38, 38, .08);
    border: 1px solid rgba(220, 38, 38, .25);
    border-radius: 11px;
  }
  .hint { margin: 16px 0 0; font-size: 12px; line-height: 1.5; color: #5c6b82; }
</style>
</head>
<body>
  <form class="box" method="post" action="/login">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.2a2 2 0 0 0-.6-1.4L12 12l-4.4 4.4A2 2 0 0 0 7 17.8V22"/><path d="M7 2v4.2a2 2 0 0 0 .6 1.4L12 12l4.4-4.4A2 2 0 0 0 17 6.2V2"/></svg>
      <h1>My Day</h1>
    </div>

    <div class="err" id="err" hidden>Wrong username or password.</div>

    <label for="user">Username
      <input id="user" name="user" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </label>
    <label for="password">Password
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </label>

    <button type="submit">Sign in</button>
    <p class="hint">You only need to do this once per device — you stay signed in for a year.</p>
  </form>

<script>
  if (new URLSearchParams(location.search).has('error')) {
    document.getElementById('err').hidden = false;
    document.getElementById('password').focus();
  }
</script>
</body>
</html>
